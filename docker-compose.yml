# Local development stack. PostgreSQL always; TigerGraph only with: docker compose --profile graph up -d
# Passwords below are LOCAL DEMO placeholders. Never reuse them anywhere real.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traceguard
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: traceguard
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceguard"]
      interval: 5s
      retries: 10

  tigergraph:
    profiles: ["graph"]
    container_name: traceguard-tigergraph
    image: tigergraph/community:latest   # pin to a tag you have verified before relying on it
    ports: ["9000:9000", "14240:14240"]
    volumes: ["./graph:/graph:ro", "tgdata:/home/tigergraph/tigergraph/data"]

volumes:
  pgdata:
  tgdata:
